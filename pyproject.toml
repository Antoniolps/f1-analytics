[project]
name = "f1-analytics"
version = "0.1.0"
description = "F1 Qualifying Prediction Engine"
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_analytics"]
